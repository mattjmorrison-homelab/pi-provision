name: Sync

# Runs every task in fleet.yaml marked `trigger: sync` against its declared
# targets, on every push to main. All of these scripts are idempotent, so
# re-running unrelated ones on an unrelated change is harmless.
on:
  push:
    branches: [main]

jobs:
  discover:
    runs-on: k8s-pi-provision
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mattjmorrison-homelab/actions-bash@08b4f8486d603001eaa42e1da223ddd91a9e3af2 # main

      - id: build-matrix
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $t is yq's own bind-variable syntax, not a shell var
          ENTRIES="$(yq -o=json '
            [.tasks[] | select(.trigger == "sync") | . as $t |
              $t.targets[] | {"script": $t.script, "target": ., "env": ($t.env // {})}]
          ' fleet.yaml)"
          echo "matrix={\"include\":${ENTRIES}}" >> "$GITHUB_OUTPUT"

  run:
    needs: discover
    if: needs.discover.outputs.matrix != '{"include":[]}'
    runs-on: k8s-pi-provision
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mattjmorrison-homelab/actions-bash@08b4f8486d603001eaa42e1da223ddd91a9e3af2 # main

      - name: Fetch ${{ matrix.target }}'s deploy key from OpenBao
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          set -euo pipefail
          JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          LOGIN_PAYLOAD="$(jq -n --arg jwt "$JWT" --arg role pi-provision-deploy '{jwt: $jwt, role: $role}')"
          CLIENT_TOKEN="$(curl -sf -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" -d "$LOGIN_PAYLOAD" | jq -r '.auth.client_token')"
          if [[ -z "$CLIENT_TOKEN" || "$CLIENT_TOKEN" == "null" ]]; then
            echo "Vault login for role pi-provision-deploy failed to return a client token" >&2
            exit 1
          fi
          curl -sf -H "X-Vault-Token: $CLIENT_TOKEN" "$VAULT_ADDR/v1/kv/data/homelab/pi/${{ matrix.target }}/private-key" \
            | jq -r '.data.data.value' > "$RUNNER_TEMP/deploy-key"
          if [[ ! -s "$RUNNER_TEMP/deploy-key" ]] || grep -qx "null" "$RUNNER_TEMP/deploy-key"; then
            echo "Failed to fetch private key for ${{ matrix.target }} from OpenBao" >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/deploy-key"
          echo "SSH_KEY_FILE=$RUNNER_TEMP/deploy-key" >> "$GITHUB_ENV"

      - name: Resolve ${{ matrix.target }}'s SSH host and task env
        run: |
          set -euo pipefail
          echo "PI_SSH=$(yq -r ".pis.\"${{ matrix.target }}\".ssh_host" fleet.yaml)" >> "$GITHUB_ENV"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<'${{ toJson(matrix.env) }}' >> "$GITHUB_ENV"

      - name: Run ${{ matrix.script }} against ${{ matrix.target }}
        run: ./${{ matrix.script }}
