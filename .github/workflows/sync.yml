name: Sync

# Provisions every Pi under fleet/ on every push to main. All of these
# scripts are idempotent, so re-running a Pi's provision.sh on an
# unrelated change is harmless.
on:
  push:
    branches: [main]

jobs:
  discover:
    runs-on: k8s-pi-provision
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mattjmorrison-homelab/actions-bash@08b4f8486d603001eaa42e1da223ddd91a9e3af2 # main

      - id: build-matrix
        run: echo "matrix=$(./build-matrix.sh)" >> "$GITHUB_OUTPUT"

  run:
    needs: discover
    if: needs.discover.outputs.matrix != '{"include":[]}'
    runs-on: k8s-pi-provision
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mattjmorrison-homelab/actions-bash@08b4f8486d603001eaa42e1da223ddd91a9e3af2 # main

      - name: Sign SSH key for ${{ matrix.target }}
        uses: mattjmorrison-homelab/actions-openbao/sign-ssh@563fc93755fa627ec1ee71ae7fd1bf5ac5bb308e # main
        with:
          role: pi-fleet
          auth-role: pi-provision-oidc
          key-file: ${{ runner.temp }}/pi-provision-deploy-key

      - id: resolve
        uses: mattjmorrison-homelab/pi-fleet/resolve-target@bbd71d9857547942c0925565fdd7399f74f1fd02 # main
        with:
          name: ${{ matrix.target }}

      - name: Set PI_SSH and SSH_KEY_FILE
        run: |
          echo "SSH_KEY_FILE=${{ runner.temp }}/pi-provision-deploy-key" >> "$GITHUB_ENV"
          echo "PI_SSH=${{ steps.resolve.outputs.ssh-user }}@${{ steps.resolve.outputs.ssh-host }}" >> "$GITHUB_ENV"

      - name: Fetch k3s join token from OpenBao
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          set -euo pipefail
          TOKEN="$(./fetch-openbao-secret.sh pi-provision-deploy homelab/pi/k3s-join-token)"
          echo "::add-mask::$TOKEN"
          echo "K3S_JOIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Provision ${{ matrix.target }}
        run: ./fleet/${{ matrix.target }}/provision.sh
